<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - J'INK Tattoo Studio</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="form-wrapper">
    <div class="form-container">
      <h1 class="graffiti-title" style="text-align: center;">WELCOME BACK</h1>

      <div id="message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">LOGIN</button>
      </form>

      <div class="form-link">
        Don't have an account? <a href="/register.html">Create one here</a>
      </div>

      <div class="form-link">
        <a href="/index.html">Back to Home</a>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.innerHTML = '<div class="alert alert-success">Login successful! Redirecting...</div>';

          // Redirect based on user role
          setTimeout(() => {
            if (data.user.role === 'admin') {
              window.location.href = '/admin-dashboard.html';
            } else {
              window.location.href = '/user-dashboard.html';
            }
          }, 1000);
        } else {
          messageDiv.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
        }
      } catch (error) {
        messageDiv.innerHTML = '<div class="alert alert-error">An error occurred. Please try again.</div>';
      }
    });
  </script>
</body>
</html>
