<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - J'INK Tattoo Studio</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="form-wrapper">
    <div class="form-container">
      <h1 class="graffiti-title" style="text-align: center;">CREATE ACCOUNT</h1>

      <div id="message"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required>
          <small class="form-text">150 characters or fewer. Letters, digits and @/./+/-/_ only.</small>
        </div>

        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" class="form-control" placeholder="Enter your first name" required>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Enter your last name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="your.email@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required>
          <small class="form-text">Your password must contain at least 8 characters.</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter your password" required>
          <small class="form-text">Enter the same password as before, for verification.</small>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">CREATE ACCOUNT</button>
      </form>

      <div class="form-link">
        Already have an account? <a href="/login.html">Login here</a>
      </div>

      <div class="form-link">
        <a href="/index.html">Back to Home</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('message');

      // Validate passwords match
      if (password !== confirmPassword) {
        messageDiv.innerHTML = '<div class="alert alert-error">Passwords do not match!</div>';
        return;
      }

      // Validate password length
      if (password.length < 8) {
        messageDiv.innerHTML = '<div class="alert alert-error">Password must be at least 8 characters long!</div>';
        return;
      }

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, firstName, lastName, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.innerHTML = '<div class="alert alert-success">Registration successful! Redirecting to login...</div>';
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        } else {
          messageDiv.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
        }
      } catch (error) {
        messageDiv.innerHTML = '<div class="alert alert-error">An error occurred. Please try again.</div>';
      }
    });
  </script>
</body>
</html>
