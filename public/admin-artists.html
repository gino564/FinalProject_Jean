<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Artists - J'INK Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="/index.html" class="navbar-brand">J'INK Admin</a>
    <ul class="navbar-menu">
      <li><a href="/admin-dashboard.html">Admin Dashboard</a></li>
      <li><a href="#" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <ul class="sidebar-menu">
        <li><a href="/admin-dashboard.html">📊 Dashboard</a></li>
        <li><a href="/admin-appointments.html">📅 Appointments</a></li>
        <li><a href="/admin-tattoos.html">🎨 Tattoo Designs</a></li>
        <li><a href="/admin-artists.html" class="active">👨‍🎨 Artists</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">Manage Artists</h1>
        <p style="color: #aaa;">Add, edit, or remove artists from your team</p>
      </div>

      <!-- Add New Artist Button -->
      <div class="card">
        <button class="btn btn-primary" onclick="openAddModal()">+ Add New Artist</button>
      </div>

      <!-- Artists Grid -->
      <div id="artistsGrid">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div id="artistModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <h2 class="modal-title" id="modalTitle">Add New Artist</h2>

      <form id="artistForm" enctype="multipart/form-data">
        <input type="hidden" id="artistId">

        <div class="form-group">
          <label for="name">Artist Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="e.g., Mike Shadow" required>
        </div>

        <div class="form-group">
          <label for="specialization">Specialization</label>
          <input type="text" id="specialization" name="specialization" class="form-control" placeholder="e.g., Realism, Japanese, Geometric" required>
        </div>

        <div class="form-group">
          <label for="bio">Biography</label>
          <textarea id="bio" name="bio" class="form-control" rows="4" placeholder="Tell us about the artist's experience and expertise..."></textarea>
        </div>

        <div class="form-group">
          <label>Artist Photo</label>
          <div class="file-upload">
            <input type="file" id="image" name="image" accept="image/*">
            <label for="image" class="file-upload-label">
              <div style="font-size: 3rem; margin-bottom: 1rem;">📷</div>
              <div>Click to upload artist photo</div>
              <small style="color: #888; margin-top: 0.5rem; display: block;">Supports: JPG, PNG, GIF (Max 5MB)</small>
            </label>
          </div>
          <div id="imagePreview" style="display: none; text-align: center; margin-top: 1rem;">
            <img id="previewImg" class="file-preview" alt="Preview">
          </div>
        </div>

        <div style="display: flex; gap: 1rem;">
          <button type="submit" class="btn btn-primary" style="flex: 1;">Save Artist</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    checkAdminAuth();

    let artists = [];
    let isEditMode = false;

    // Load artists
    async function loadArtists() {
      try {
        const response = await fetch('/api/artists');
        artists = await response.json();
        displayArtists();
      } catch (error) {
        console.error('Error loading artists:', error);
        document.getElementById('artistsGrid').innerHTML = '<p style="color: #dc3545;">Failed to load artists</p>';
      }
    }

    // Display artists
    function displayArtists() {
      const container = document.getElementById('artistsGrid');

      if (artists.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">👨‍🎨</div>
            <div class="empty-state-text">No artists yet</div>
            <button class="btn btn-primary" onclick="openAddModal()">Add Your First Artist</button>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="card-grid">
          ${artists.map(artist => `
            <div class="card">
              <div style="text-align: center;">
                ${artist.image_url ?
                  `<img src="${artist.image_url}" alt="${artist.name}" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin: 0 auto 1rem; border: 3px solid var(--gold);" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` :
                  `<div style="width: 150px; height: 150px; background: linear-gradient(135deg, var(--gold) 0%, #c9a02e 100%); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: var(--dark); font-weight: 700;">${artist.name.split(' ').map(n => n[0]).join('')}</div>`
                }
                <h3 style="color: var(--gold); margin-bottom: 0.5rem;">${artist.name}</h3>
                <p style="color: #aaa; margin-bottom: 1rem; font-weight: 600;">${artist.specialization}</p>
                <p style="color: #888; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem;">${artist.bio || 'No bio available'}</p>
                <div style="display: flex; gap: 0.5rem;">
                  <button class="btn btn-secondary btn-small" onclick="editArtist(${artist.id})" style="flex: 1;">Edit</button>
                  <button class="btn btn-danger btn-small" onclick="deleteArtist(${artist.id})" style="flex: 1;">Delete</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Open add modal
    function openAddModal() {
      isEditMode = false;
      document.getElementById('modalTitle').textContent = 'Add New Artist';
      document.getElementById('artistForm').reset();
      document.getElementById('artistId').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      document.getElementById('artistModal').classList.add('active');
    }

    // Edit artist
    function editArtist(id) {
      const artist = artists.find(a => a.id === id);
      if (!artist) return;

      isEditMode = true;
      document.getElementById('modalTitle').textContent = 'Edit Artist';
      document.getElementById('artistId').value = artist.id;
      document.getElementById('name').value = artist.name;
      document.getElementById('specialization').value = artist.specialization;
      document.getElementById('bio').value = artist.bio || '';

      // Show current image
      if (artist.image_url) {
        document.getElementById('previewImg').src = artist.image_url;
        document.getElementById('imagePreview').style.display = 'block';
      }

      document.getElementById('artistModal').classList.add('active');
    }

    // Delete artist
    async function deleteArtist(id) {
      if (!confirm('Are you sure you want to delete this artist? This action cannot be undone.')) {
        return;
      }

      try {
        const response = await fetch(`/api/artists/${id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          alert('Artist deleted successfully!');
          loadArtists();
        } else {
          const data = await response.json();
          alert('Error: ' + data.error);
        }
      } catch (error) {
        alert('An error occurred. Please try again.');
      }
    }

    // Close modal
    function closeModal() {
      document.getElementById('artistModal').classList.remove('active');
    }

    // Image preview
    document.getElementById('image').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('previewImg').src = e.target.result;
          document.getElementById('imagePreview').style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // Submit form
    document.getElementById('artistForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData();
      formData.append('name', document.getElementById('name').value);
      formData.append('specialization', document.getElementById('specialization').value);
      formData.append('bio', document.getElementById('bio').value);

      const imageFile = document.getElementById('image').files[0];
      if (imageFile) {
        formData.append('image', imageFile);
      }

      try {
        const artistId = document.getElementById('artistId').value;
        const url = isEditMode ? `/api/artists/${artistId}` : '/api/artists';
        const method = isEditMode ? 'PUT' : 'POST';

        const response = await fetch(url, {
          method: method,
          body: formData
        });

        if (response.ok) {
          alert(`Artist ${isEditMode ? 'updated' : 'created'} successfully!`);
          closeModal();
          loadArtists();
        } else {
          const data = await response.json();
          alert('Error: ' + data.error);
        }
      } catch (error) {
        alert('An error occurred. Please try again.');
      }
    });

    // Close modal on outside click
    document.getElementById('artistModal').addEventListener('click', (e) => {
      if (e.target.id === 'artistModal') {
        closeModal();
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await logout();
    });

    // Initialize
    loadArtists();
  </script>
</body>
</html>
